<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evosim — Living Ecosystem</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="world"></canvas>

      <header class="topbar glass">
        <div class="brand">EVO<span>SIM</span></div>
        <div class="divider"></div>
        <div class="clock">
          <canvas id="clock-dial" width="72" height="72"></canvas>
          <div>
            <div id="clock-primary" class="clock-primary">Day 1 · Spring</div>
            <div id="clock-secondary" class="muted small">Year 1 · 07:12</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="transport">
          <button id="btn-pause" class="icon-btn" data-tip="Pause / resume (Space)"></button>
          <div id="speed-group" class="segmented"></div>
        </div>
        <div class="divider"></div>
        <div class="actions">
          <button id="btn-new" class="icon-btn" data-tip="New world (N)"></button>
          <button id="btn-save" class="icon-btn" data-tip="Save (Ctrl+S)"></button>
          <button id="btn-load" class="icon-btn" data-tip="Load (Ctrl+O)"></button>
          <button id="btn-view" class="icon-btn" data-tip="View options (V)"></button>
          <button id="btn-help" class="icon-btn" data-tip="Help (?)"></button>
        </div>
        <div id="view-menu" class="dropdown glass hidden"></div>
      </header>

      <aside id="eco-panel" class="panel left glass">
        <div class="panel-header">
          <h2>Ecosystem</h2>
          <button id="btn-collapse" class="icon-btn small" data-tip="Collapse panel"></button>
        </div>
        <div class="panel-body">
          <div id="species-cards" class="species-cards"></div>
          <div class="resource-bars">
            <div class="resource">
              <div class="resource-label"><span>Vegetation</span><span id="veg-value" class="muted">—</span></div>
              <div class="bar"><div id="veg-bar" class="bar-fill veg"></div></div>
            </div>
            <div class="resource">
              <div class="resource-label"><span>Algae</span><span id="algae-value" class="muted">—</span></div>
              <div class="bar"><div id="algae-bar" class="bar-fill algae"></div></div>
            </div>
          </div>
          <div class="tabs" id="chart-tabs">
            <button data-tab="population" class="active">Population</button>
            <button data-tab="evolution">Evolution</button>
          </div>
          <div class="chart-wrap">
            <canvas id="main-chart"></canvas>
          </div>
          <div id="evolution-controls" class="chip-row hidden"></div>
          <div id="trait-controls" class="chip-row hidden"></div>
          <div class="totals" id="totals"></div>
        </div>
      </aside>

      <aside id="inspector" class="panel right glass hidden"></aside>

      <div id="toasts"></div>

      <div class="minimap glass">
        <canvas id="minimap" width="240" height="160"></canvas>
        <div id="minimap-legend" class="legend"></div>
      </div>

      <div id="statusbar" class="statusbar"></div>
      <div id="tooltip" class="tooltip hidden"></div>

      <div id="modal-root"></div>

      <div id="loading">
        <div class="loading-card">
          <div class="brand big">EVO<span>SIM</span></div>
          <p class="muted">A living ecosystem shaped by natural selection</p>
          <div class="progress"><div id="loading-bar"></div></div>
          <p id="loading-status" class="muted small">Seeding the world…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
